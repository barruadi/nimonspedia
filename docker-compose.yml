services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubes-wbd
    ports:
      - '8080:80'
    env_file:
      - ./.env
    volumes:
      - ./php/src:/var/www/app
    depends_on:
      - db
      
  db:
    image: postgres:16
    container_name: tubes-wbd-db
    ports:
      - "5433:5432"
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./php/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: