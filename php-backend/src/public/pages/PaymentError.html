<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Gagal - Nimonspedia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out 0.2s both;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    .icon svg {
      width: 48px;
      height: 48px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 28px;
      color: #1f2937;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .order-id {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .message {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }

    .error-title {
      color: #991b1b;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .error-message {
      color: #dc2626;
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      border: none;
    }

    .btn-primary {
      background: #ef4444;
      color: white;
    }

    .btn-primary:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #1f2937;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 24px;
      }

      h1 {
        font-size: 24px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <h1>Pembayaran Gagal</h1>
    <p class="order-id">Order ID: <span id="orderId">N/A</span></p>

    <p class="message">
      Maaf, pembayaran Anda tidak dapat diproses. Silakan coba lagi atau hubungi customer service jika masalah berlanjut.
    </p>

    <div class="error-box" id="errorBox" style="display: none;">
      <div class="error-title">Detail Error:</div>
      <div class="error-message" id="errorMessage">-</div>
    </div>

    <div class="buttons">
      <a href="javascript:void(0)" onclick="retryPayment()" class="btn btn-primary">Coba Lagi</a>
      <a href="/products" class="btn btn-secondary">Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    // Get order_id from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    const statusCode = urlParams.get('status_code');
    const statusMessage = urlParams.get('status_message');

    if (orderId) {
      document.getElementById('orderId').textContent = orderId;
    }

    if (statusMessage) {
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorMessage').textContent = decodeURIComponent(statusMessage);
    }

    function retryPayment() {
      // Redirect back to home and trigger top-up modal
      window.location.href = '/products';

      // After redirect, trigger modal (this will only work if staying on same page)
      setTimeout(() => {
        window.dispatchEvent(new Event('open-top-up-modal'));
      }, 500);
    }
  </script>
</body>
</html>
