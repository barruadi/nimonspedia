<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <link rel="stylesheet" href="/styles/Login.css">
  </head>
  
  <body>
    <main class="login-page">
      <section class="login-left">
        <div class="illustration">
          <img src="/uploads/auth/login-art.png" alt="Shopping illustration" class="hero-img" />
        </div>

        <div class="left-copy">
          <h2 class="left-headline">
            Jual Beli Mudah Hanya di<span class="brand">Nimonspedia</span>
          </h2>
          <p class="left-sub">
            Masuk dan rasakan kemudahan bertransaksi di Nimonspedia
          </p>
        </div>
      </section>

      <!-- Right side card -->
      <section class="login-card">
        <header class="login-header">
          <h1 class="login-title">Masuk</h1>
          <p class="login-sub">
            Belum punya akun Nimonspedia?
            <a class="login-link" href="/register">Daftar sekarang</a>
          </p>
        </header>

        <!-- error -->
        <div id="loginError" class="error-box" style="display:none"></div>

        <!-- form -->
        <form id="loginForm" class="login-form">
          <div class="field">
            <label>Email*</label>
            <div class="input-wrap">
              <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="Masukkan alamat email"
                required
              />
            </div>
          </div>

          <div class="field">
            <label>Password*</label>
            <div class="input-wrap with-icon">
              <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Masukkan password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="reveal-btn"
                aria-label="Show password"
              >
                <img id="eyeIcon" src="/uploads/auth/eye-icon.png" alt="" aria-hidden="true" />
              </button>
            </div>
          </div>

          <button id="loginSubmitBtn" type="submit" class="primary-btn">
            Masuk
          </button>
        </form>
        
        <footer class="page-footer">
            Butuh bantuan? Hubungi Nimonspedia Care
        </footer>
      </section>
    </main>

    <script type="module" src="/script/Login.js" defer></script>
  </body>
</html>
