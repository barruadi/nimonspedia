<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Produk - Nimonspedia</title>
    <link rel="stylesheet" href="/styles/ProductManagement.css">
  </head>
  <body>
    <app-loading></app-loading>

    <div class="product-management-page">
      <!-- Main Content - Shown after data has been successfully loaded -->
      <div id="mainContent" style="display: none;">
        <!-- Header Section -->
        <div class="page-header">
          <h1 class="page-title">Manajemen Produk</h1>
          <button type="button" id="addProductBtn" class="btn-add-product">
            + Tambah Produk
          </button>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-section">
          <!-- Search Input -->
          <div class="search-container">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input 
              type="text" 
              id="searchInput" 
              class="search-input" 
              placeholder="Cari produk..."
            />
          </div>

          <!-- Category Filter -->
          <select id="categoryFilter" class="filter-select">
            <option value="">Semua Produk</option>
          </select>

          <!-- Sort Order -->
          <select id="sortOrder" class="filter-select">
            <option value="name-asc">Sort by Alphabet ↑</option>
            <option value="name-desc">Sort by Alphabet ↓</option>
            <option value="price-asc">Sort by Harga ↑</option>
            <option value="price-desc">Sort by Harga ↓</option>
            <option value="stock-asc">Sort by Stok ↑</option>
            <option value="stock-desc">Sort by Stok ↓</option>
          </select>
        </div>

        <!-- Products Grid -->
        <div id="productGridContainer" class="product-grid">
          <!-- Products will be rendered here -->
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <img src="/uploads/seller/dashboard-logo.svg" alt="Empty State" class="empty-state-icon">
        <h2 class="empty-state-title">Belum ada produk</h2>
        <p class="empty-state-subtitle">Yuk, tambahkan produk pertamamu!</p>
        <button type="button" id="addFirstProductBtn" class="btn-add-first">
          + Tambah Produk
        </button>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModalBackdrop" class="modal-backdrop" style="display:none;">
      <div id="deleteConfirmationModal" class="modal">
        <img src="/uploads/seller/delete-logo.svg" alt="Delete Icon" class="modal-icon" />
        <div class="confirmation-text" id="deleteConfirmationText">Apakah anda yakin ingin menghapus produk?</div>
        <div class="confirmation-buttons">
          <button type="button" id="deleteModalCancelBtn" class="btn-modal-cancel">Batal</button>
          <button type="button" id="deleteModalConfirmBtn" class="btn-modal-confirm btn-modal-danger">Hapus</button>
        </div>
      </div>
    </div>

    <script type="module" src="/script/ProductManagement.js" defer></script>
  </body>
</html>
