<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mulai Lelang - Nimonspedia</title>
    <link rel="stylesheet" href="/styles/AddProduct.css">
    <link rel="stylesheet" href="/styles/ToastNotification.css">
    <link rel="stylesheet" href="/styles/LoadingComponent.css">
  </head>
  <body>
    <app-loading></app-loading>
    <app-toast></app-toast>

    <div class="add-product-page" id="mainContent" style="display: none;">
      <!-- Left Side - Product Preview (Read-only) -->
      <div class="product-image-section">
        <div class="image-upload-container" style="cursor: default; border-color: #05AA5B; background-color: #f0fdf4;">
          <div id="imagePreviewContainer" class="image-preview">
            <img id="productPreviewImage" src="" alt="Product Preview" loading="lazy"/>
          </div>
        </div>
        
        <!-- Product Info Preview -->
        <div class="product-preview-info" style="display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; background-color: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;">
          <div>
            <div style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0.25rem;">Nama Produk</div>
            <div id="productPreviewName" style="font-size: 1rem; font-weight: 600; color: #111827;"></div>
          </div>
          <div>
            <div style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0.25rem;">Harga Asli</div>
            <div id="productPreviewPrice" style="font-size: 1rem; font-weight: 600; color: #111827;"></div>
          </div>
          <div>
            <div style="font-size: 0.875rem; color: #6b7280; margin-bottom: 0.25rem;">Stok Tersedia</div>
            <div id="productPreviewStock" style="font-size: 1rem; font-weight: 600; color: #111827;"></div>
          </div>
        </div>
      </div>

      <!-- Right Side - Auction Form -->
      <div class="product-details-section">
        <h1 class="form-title">Mulai Lelang</h1>

        <form id="auctionForm" class="product-form">
          <input type="hidden" id="product_id" name="product_id" />

          <!-- Starting Price -->
          <div class="form-group">
            <label for="startingPrice" class="form-label">
              Harga Awal Lelang (Rp)<span class="required">*</span>
            </label>
            <input 
              type="number" 
              id="startingPrice" 
              name="starting_price" 
              class="form-input" 
              placeholder="Masukkan harga awal lelang (minimal 1000)"
              min="1000"
              step="1"
              required 
            />
            <span class="error-message" id="startingPriceError"></span>
          </div>

          <!-- Quantity -->
          <div class="form-group form-group-half">
            <label for="quantity" class="form-label">
              Jumlah (Qty)<span class="required">*</span>
            </label>
            <input 
              type="number" 
              id="quantity" 
              name="quantity" 
              class="form-input" 
              placeholder="Masukkan jumlah item untuk lelang"
              min="1"
              step="1"
              required 
            />
            <span class="error-message" id="quantityError"></span>
          </div>

          <!-- Minimum Increment -->
          <div class="form-group form-group-half">
            <label for="minIncrement" class="form-label">
              Minimum Kenaikan Bid (Rp)<span class="required">*</span>
            </label>
            <input 
              type="number" 
              id="minIncrement" 
              name="min_increment" 
              class="form-input" 
              placeholder="Contoh: 5000"
              min="1000"
              step="1000"
              value="5000"
              required 
            />
            <span class="error-message" id="minIncrementError"></span>
          </div>

          <!-- Start Time -->
          <div class="form-group">
            <label for="startTime" class="form-label">
              Waktu Mulai Lelang<span class="required">*</span>
            </label>
            <input 
              type="datetime-local" 
              id="startTime" 
              name="start_time" 
              class="form-input"
              required 
            />
            <span class="error-message" id="startTimeError"></span>
            <div style="font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem;">Waktu mulai harus setelah waktu sekarang</div>
          </div>



          <!-- Form Actions -->
          <div class="form-actions">
            <button type="button" id="cancelBtn" class="btn btn-cancel">
              Batal
            </button>
            <button type="submit" id="submitBtn" class="btn btn-submit">
              Mulai Lelang
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Cancel Confirmation Modal -->
    <div id="cancelModalBackdrop" class="modal-backdrop" style="display:none;">
      <div id="cancelConfirmationModal" class="modal">
        <img src="/uploads/seller/edit-confirmation-logo.svg" alt="Confirmation Icon" class="modal-icon" loading="lazy"/>
        <div class="confirmation-text">Apakah anda yakin ingin menyimpan auction?</div>
        <div class="confirmation-buttons">
          <button type="button" id="cancelModalCancelBtn" class="btn-modal-cancel">Batal</button>
          <button type="button" id="cancelModalConfirmBtn" class="btn-modal-confirm">Lanjut</button>
        </div>
      </div>
    </div>

    <script type="module" src="/components/ToastNotification.js"></script>
    <script type="module" src="/components/LoadingComponent.js"></script>
    <script type="module" src="/script/AuctionForm.js" defer></script>
  </body>
</html>
