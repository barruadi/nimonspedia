<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Management: Add Product</title>
    <!-- Optional: Rich text editor CDN (Quill.js) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
      .preview-container {
        margin: 10px 0;
        display: none;
      }
      .preview-image {
        max-width: 300px;
        max-height: 300px;
        border: 1px solid #ccc;
        padding: 5px;
      }
      .error { color: red; font-size: 0.9em; }
      .progress-bar {
        width: 100%;
        height: 20px;
        background: #f0f0f0;
        border-radius: 5px;
        overflow: hidden;
        display: none;
      }
      .progress-fill {
        height: 100%;
        background: #4CAF50;
        width: 0%;
        transition: width 0.3s;
      }
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #4CAF50;
        color: white;
        padding: 15px 20px;
        border-radius: 5px;
        display: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <h1>Add New Product</h1>
    <p>Store: <span id="store_name">Loading...</span></p>

    <form id="addProductForm" enctype="multipart/form-data">
      <input type="hidden" id="store_id" name="store_id" />

      <!-- Product Name -->
      <label for="productName">Product Name: <span style="color:red">*</span></label>
      <input 
        id="productName" 
        name="name" 
        type="text" 
        maxlength="200"
        required 
        placeholder="Enter product name (max 200 characters)"
      />
      <span class="error" id="nameError"></span>
      <br><br>

      <!-- Description (Rich Text) -->
      <label for="productDescription">Description: <span style="color:red">*</span></label>
      <div id="editor" style="height: 200px;"></div>
      <input type="hidden" id="productDescription" name="description">
      <span class="error" id="descError"></span>
      <br><br>

      <!-- Category -->
      <label for="productCategory">Category: <span style="color:red">*</span></label>
      <select id="productCategory" name="category_id" required>
        <option value="">-- Select Category --</option>
        <!-- Categories akan di-populate dari API -->
      </select>
      <span class="error" id="categoryError"></span>
      <br><br>

      <!-- Price -->
      <label for="productPrice">Price (Rp): <span style="color:red">*</span></label>
      <input 
        id="productPrice" 
        name="price" 
        type="number" 
        step="0.01" 
        min="1000" 
        required 
        placeholder="Min. Rp 1,000"
      />
      <span class="error" id="priceError"></span>
      <br><br>

      <!-- Stock -->
      <label for="productStock">Stock: <span style="color:red">*</span></label>
      <input 
        id="productStock" 
        name="stock" 
        type="number" 
        min="0" 
        required 
        placeholder="0"
      />
      <span class="error" id="stockError"></span>
      <br><br>

      <!-- Image Upload -->
      <label for="productImage">Product Image: <span style="color:red">*</span></label>
      <input 
        id="productImage" 
        name="image" 
        type="file" 
        accept="image/jpeg,image/jpg,image/png,image/webp"
        required
      />
      <span class="error" id="imageError"></span>
      <br>
      
      <!-- Image Preview -->
      <div class="preview-container" id="previewContainer">
        <img id="previewImage" class="preview-image" src="" alt="Preview">
        <br>
        <button type="button" id="changeImageBtn">Ganti Foto</button>
      </div>
      <br>

      <!-- Progress Bar -->
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <br>

      <!-- Submit Buttons -->
      <button type="submit" id="submitBtn">Simpan</button>
      <button type="button" id="cancelBtn">Batal</button>
    </form>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Rich Text Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="/script/AddProduct.js"></script>
  </body>
</html>
