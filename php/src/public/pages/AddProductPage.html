<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product - Nimonspedia</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/AddProduct.css">
  </head>
  <body>
    <app-loading></app-loading>

    <div class="add-product-page" id="mainContent" style="display: none;">
      <!-- Left Side - Product Image Upload -->
      <div class="product-image-section">
        <div class="image-upload-container">
          <input type="file" id="productImage" accept="image/*" hidden />
          
          <div id="imagePreviewContainer" class="image-preview" style="display: none;">
            <img id="imagePreview" src="" alt="Product Preview" />
          </div>
          
          <div id="imagePlaceholder" class="image-placeholder">
            <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <p class="placeholder-text">Belum ada foto produk yang diunggah</p>
          </div>
        </div>
        
        <button type="button" id="uploadBtn" class="upload-btn">
          Unggah Foto
        </button>
      </div>

      <!-- Right Side - Product Details Form -->
      <div class="product-details-section">
        <h1 class="form-title">Tambah Produk</h1>

        <form id="addProductForm" class="product-form">
          <input type="hidden" id="store_id" name="store_id" />

          <!-- Product Name -->
          <div class="form-group">
            <label for="productName" class="form-label">
              Nama Produk<span class="required">*</span>
            </label>
            <input 
              type="text" 
              id="productName" 
              name="name" 
              class="form-input" 
              placeholder="Masukkan nama produk (maksimal 200 karakter)"
              maxlength="200"
              required 
            />
            <span class="error-message" id="nameError"></span>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label">
              Deskripsi<span class="required">*</span>
            </label>
            
            <!-- Quill Editor Container -->
            <div id="editor"></div>
            
            <!-- Hidden textarea untuk store data -->
            <textarea id="productDescription" name="description" style="display: none;"></textarea>
            
            <div style="margin-top: 0.5rem; font-size: 0.875rem; color: #6b7280; text-align: right;">
              <span id="charCount">0</span> / 1000 karakter
            </div>
            <span class="error-message" id="descError"></span>
          </div>

          <!-- Category & Price Row -->
          <div class="form-row">
            <div class="form-group form-group-half">
              <label for="productCategory" class="form-label">
                Kategori<span class="required">*</span>
              </label>
              <select 
                id="productCategory" 
                name="category_id" 
                class="form-select"
                required
              >
                <option value="">Pilih kategori produk</option>
              </select>
              <span class="error-message" id="categoryError"></span>
            </div>

            <div class="form-group form-group-half">
              <label for="productPrice" class="form-label">
                Harga<span class="required">*</span>
              </label>
              <input 
                type="number" 
                id="productPrice" 
                name="price" 
                class="form-input" 
                placeholder="Masukkan harga dalam rupiah (minimal 1000)"
                min="1000"
                step="1"
                required 
              />
              <span class="error-message" id="priceError"></span>
            </div>
          </div>

          <!-- Stock -->
          <div class="form-group form-group-half">
            <label for="productStock" class="form-label">
              Stok<span class="required">*</span>
            </label>
            <input 
              type="number" 
              id="productStock" 
              name="stock" 
              class="form-input" 
              placeholder="Masukkan jumlah stok (minimal 0)"
              min="0"
              required 
            />
            <span class="error-message" id="stockError"></span>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button type="button" id="cancelBtn" class="btn btn-cancel">
              Batal
            </button>
            <button type="submit" id="submitBtn" class="btn btn-submit">
              Simpan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Cancel Confirmation Modal -->
    <div id="cancelModalBackdrop" class="modal-backdrop" style="display:none;">
      <div id="cancelConfirmationModal" class="modal">
        <img src="/uploads/seller/edit-confirmation-logo.svg" alt="Confirmation Icon" class="modal-icon" />
        <div class="confirmation-text">Batal menambahkan produk? Perubahan tidak akan tersimpan.</div>
        <div class="confirmation-buttons">
          <button type="button" id="cancelModalCancelBtn" class="btn-modal-cancel">Lanjut</button>
          <button type="button" id="cancelModalConfirmBtn" class="btn-modal-confirm">Batal</button>
        </div>
      </div>
    </div>
  </body>
</html>
