<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Keranjang</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --border:#e5e7eb; --muted:#6b7280; --green:#22c55e; --green-weak:#d1fae5; --shadow:0 8px 24px rgba(0,0,0,.06); }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#111; }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
    @media (max-width: 900px){ .grid { grid-template-columns: 1fr; } }

    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow: var(--shadow);}
    .empty { display:flex; gap:24px; align-items:center; }
    .empty-img { width:160px; height:120px; background:#fffbea; border-radius:12px; display:grid; place-items:center; }
    .empty h3 { margin:0 0 6px; font-size:18px; }
    .empty p { margin:0 0 14px; color: var(--muted); }
    .btn { display:inline-block; padding:12px 22px; border-radius:12px; font-weight:600; text-align:center; cursor:pointer; border:1px solid transparent; }
    .btn-green { background: var(--green); color:#fff; }
    .btn-green[disabled] { opacity:.5; cursor:not-allowed; }
    .btn-outline { background:#fff; border-color: var(--border); color:#111; }
    .btn-weak { background: var(--green-weak); color:#198754; border-color: transparent; }

    .item { display:grid; grid-template-columns: 28px 64px 1fr 120px 120px 32px; gap:12px; align-items:center; padding:12px 0; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom:none; }
    .thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--border); }
    .title { font-weight:600; font-size:14px; margin-bottom:4px; }
    .price { font-weight:600; }
    .muted { color: var(--muted); font-size: 12px; }
    .qty { display:flex; align-items:center; gap:6px; }
    .qty input { width:54px; padding:6px 8px; border:1px solid var(--border); border-radius:10px; }
    .rm { border:none; background:transparent; cursor:pointer; font-size:18px; color:#aaa; }

    .sum h3 { margin:0 0 12px; font-size:20px; }
    .sum-row { display:flex; justify-content:space-between; margin:8px 0; color: var(--muted); }
    .sum-row.total { color:#111; font-weight:700; font-size:20px; }
    .box { background:#f9fafb; border:1px solid var(--border); border-radius:12px; padding:14px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .all { display:flex; align-items:center; gap:8px; }
    .all input { width:16px; height:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Keranjang</h1>
    <div class="grid">
      <!-- LEFT -->
      <section class="card" id="cart-left">
        <div class="topbar">
          <label class="all">
            <input type="checkbox" id="check-all">
            <span>Pilih semua</span>
          </label>
          <button id="remove-selected" class="btn btn-outline">Hapus yang dipilih</button>
        </div>
        <div id="cart-list"></div>

        <!-- Empty state -->
        <div id="empty" class="empty" style="display:none">
          <div>
            <h3>Wah, keranjang belanjamu kosong</h3>
            <p>Yuk, isi dengan barang-barang impianmu!</p>
            <a class="btn btn-green" href="/products" data-nav>Mulai Belanja</a>
          </div>
        </div>
      </section>

      <!-- RIGHT -->
      <aside class="card sum" id="cart-right">
        <h3>Ringkasan Belanja</h3>
        <div class="box">
          <div class="sum-row"><span>Total Item</span><strong id="sum-items">0</strong></div>
          <div class="sum-row"><span>Total Harga</span><strong id="sum-price">Rp 0</strong></div>
        </div>
        <button id="btn-checkout" class="btn btn-green" style="width:100%; margin-top:12px" disabled>Beli</button>
      </aside>
    </div>
  </div>

  <script type="module" src="/script/Cart.js"></script>
</body>
</html>
