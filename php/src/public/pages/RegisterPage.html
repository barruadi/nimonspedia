<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/Register.css">
  </head>

  <body>
    <div class="register-page">
      <div class="reg-card">

        <!-- title / subtitle -->
        <header class="reg-header">
          <h1 class="reg-title">Daftar Sekarang</h1>
          <p class="reg-subtitle">
            Sudah punya akun Nimonspedia?
            <a href="/login" class="login-link">Masuk</a>
          </p>
        </header>

        <!-- error box -->
        <div id="errorBox" class="error-box" style="display:none"></div>

        <!-- STEP 1: ROLE PICK -->
        <section class="step active" id="step-role">
          <div class="role-list">
            <!-- keep class role-card so JS still works -->
            <button
              class="role-item role-card active"
              data-role="buyer"
              type="button"
            >
              <span class="role-main">Buyer</span>
              <span class="role-desc">Beli produk dari penjual</span>
            </button>

            <button
              class="role-item role-card"
              data-role="seller"
              type="button"
            >
              <span class="role-main">Seller</span>
              <span class="role-desc">Kelola toko dan pesanan</span>
            </button>
          </div>

          <div class="actions only-next">
            <button id="toStep2" class="primary-btn" disabled>Lanjut</button>
          </div>
        </section>

        <!-- STEP 2: USER INFO -->
        <section class="step" id="step-user">
          <div class="form-grid">
            <div class="field">
              <label>Nama*</label>
              <div class="input-wrap">
                <input id="fullNameInput" type="text" placeholder="Masukkan nama akun" maxlength="200" required />
              </div>
            </div>

            <div class="field">
              <label>Email*</label>
              <div class="input-wrap">
                <input id="emailInput" type="email" placeholder="Masukkan alamat email" required />
              </div>
            </div>

            <div class="field">
              <label>Password*</label>
              <div class="input-wrap with-icon">
                <input id="passwordInput" type="password" placeholder="Masukkan password" required />
                <button type="button" class="reveal-btn" aria-label="Show password" aria-pressed="false">
                  <img class="eye-icon" src="/uploads/auth/eye-icon.png" alt="" aria-hidden="true" />
                </button>
              </div>
            </div>

            <div class="field">
              <label>Validasi Password*</label>
              <div class="input-wrap with-icon">
                <input id="confirmPasswordInput" type="password" placeholder="Masukkan validasi password" required />
                <button type="button" class="reveal-btn" aria-label="Show password" aria-pressed="false">
                  <img class="eye-icon" src="/uploads/auth/eye-icon.png" alt="" aria-hidden="true" />
                </button>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="secondary-btn" id="backToStep1">Kembali</button>
            <button id="toNextAfterUser" class="primary-btn">Lanjut</button>
          </div>
        </section>

        <!-- STEP 3 (seller only): store info -->
        <section class="step" id="step-store">
          <!-- Logo Upload -->
          <div class="form-group">
            <label class="form-label">Logo Toko<span class="required">*</span></label>

            <div class="image-upload-container" id="logoDropArea" aria-label="Unggah logo toko">
              <input type="file" id="storeLogoInput" accept="image/*" hidden />

              <div id="logoPreviewContainer" class="image-preview" style="display:none;">
                <img id="logoPreview" src="" alt="Pratinjau Logo Toko" />
              </div>

              <div id="logoPlaceholder" class="image-placeholder">
                <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <p class="placeholder-text">Belum ada logo toko</p>
                <p class="hint">JPG, PNG, atau WEBP • Maks 2MB • Disarankan 1:1</p>
              </div>
            </div>

            <div class="upload-actions">
              <button type="button" id="uploadLogoBtn" class="upload-btn">Unggah Logo</button>
              <button type="button" id="removeLogoBtn" class="secondary-btn" style="display:none;">Hapus</button>
            </div>
          </div>

          <!-- Store Name -->
          <div class="form-group">
            <label for="storeNameInput" class="form-label">Nama Toko<span class="required">*</span></label>
            <input
              id="storeNameInput"
              type="text"
              class="form-input"
              placeholder="Contoh: Warung Geprek Mbak Uni"
              maxlength="100"
              required
            />
            <span class="error-message" id="storeNameError"></span>
          </div>

          <!-- Store Description (Quill) -->
          <div class="form-group">
            <label class="form-label">Deskripsi Toko<span class="required">*</span></label>
            <div id="storeEditor"></div>
            <textarea id="storeDescription" name="store_description" style="display:none;"></textarea>
            <div class="help-row"><span id="storeDescCount">0</span> / 1000 karakter</div>
            <span class="error-message" id="storeDescError"></span>
          </div>

          <div class="actions">
            <button class="secondary-btn" id="backToStep2">Kembali</button>
            <button id="submitSeller" class="primary-btn">Daftar sebagai Penjual</button>
          </div>
        </section>

        <!-- STEP 4 (buyer final submit / review) -->
        <section class="step" id="step-review">
          <div class="review-block">
            <div class="summary-line">
              <span class="summary-label">Peran:</span>
              <span id="summaryRole"></span>
            </div>
            <div class="summary-line">
              <span class="summary-label">Nama:</span>
              <span id="summaryName"></span>
            </div>
            <div class="summary-line">
              <span class="summary-label">Email:</span>
              <span id="summaryEmail"></span>
            </div>
            <div class="summary-line seller-only" style="display:none">
              <span class="summary-label">Nama Toko:</span>
              <span id="summaryStore"></span>
            </div>
          </div>

          <div class="actions">
            <button class="secondary-btn" id="backToStep2FromReview">Kembali</button>
            <button id="submitBuyer" class="primary-btn">Buat Akun</button>
          </div>
        </section>

        <!-- terms -->
        <footer class="terms">
          <p>
            Dengan mendaftar, saya menyetujui<br />
            Syarat &amp; Ketentuan serta Kebijakan Privasi Tokopedia.
          </p>
        </footer>
      </div>
    </div>

    <!-- Page JS -->
    <script type="module" src="/script/Register.js" defer></script>
  </body>
</html>
